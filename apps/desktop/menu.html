<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>Pawmetry Options</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./menu.css">
<main role="menu" aria-label="Companion options">
  <div class="caption" role="presentation">Display mode</div>
  <button role="menuitemradio" aria-checked="false" data-command="mode-pet" tabindex="-1"><i class="icon icon-square" aria-hidden="true"></i>Pet only<i class="icon icon-check selected" aria-hidden="true"></i></button>
  <button role="menuitemradio" aria-checked="false" data-command="mode-compact" tabindex="-1"><i class="icon icon-panel-top" aria-hidden="true"></i>Compact<i class="icon icon-check selected" aria-hidden="true"></i></button>
  <button role="menuitemradio" aria-checked="false" data-command="mode-dashboard" tabindex="-1"><i class="icon icon-layout-dashboard" aria-hidden="true"></i>Dashboard<i class="icon icon-check selected" aria-hidden="true"></i></button>
  <hr role="separator">
  <button role="menuitem" data-command="toggle-animation" tabindex="-1"><i class="icon icon-pause" aria-hidden="true"></i><span>Pause animations</span></button>
  <button role="menuitem" data-command="toggle-monitoring" tabindex="-1"><i class="icon icon-activity" aria-hidden="true"></i><span>Pause monitoring</span></button>
  <button role="menuitem" data-command="refresh" tabindex="-1"><i class="icon icon-refresh-cw" aria-hidden="true"></i>Refresh usage</button>
  <button role="menuitemcheckbox" aria-checked="false" data-command="toggle-click" tabindex="-1"><i class="icon icon-mouse-pointer-2" aria-hidden="true"></i>Click-through<i class="icon icon-check selected" aria-hidden="true"></i></button>
  <hr role="separator">
  <button role="menuitem" data-command="settings" tabindex="-1"><i class="icon icon-settings" aria-hidden="true"></i>Settings</button>
  <button role="menuitem" class="danger" data-command="quit" tabindex="-1"><i class="icon icon-log-out" aria-hidden="true"></i>Exit Pawmetry</button>
</main>
<script src="./menu.js"></script>
</html>
